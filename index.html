<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミライと自由研究</title>
<meta name="description" content="小学生向けの生成AIリテラシー・ノベルゲーム。AIアシスタント『ミライ』の答えのおかしなところを赤ペンで見つけて直し、先生に提出して採点されます。">
<meta name="theme-color" content="#9CDCEF">
<meta property="og:type" content="website">
<meta property="og:title" content="ミライと自由研究">
<meta property="og:description" content="小学生向け・生成AIとのつきあい方ゲーム。AIのまちがいを赤ペンで見つけよう。">
<meta property="og:url" content="https://codopro.github.io/ai-literacy-game/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
</head>
<body><style>
/* ============ tokens ============ */
:root{
  --paper:#FFFEF7;
  --card:#FFF7E6;
  --grid:#DDEDF8;
  --ink:#354553;
  --ink2:#71879A;
  --line:#EADFC7;
  --red:#FF4B3E;
  --red-soft:#FFE9E6;
  --ai:#00A3B8;
  --ai-soft:#DCF4F8;
  --me:#3E8CE0;
  --me-soft:#E5F0FE;
  --sensei:#FF6FA5;
  --sensei-soft:#FFE7F0;
  --ok:#2FB673;
  --ok-soft:#E0F6EB;
  --sun:#FFC63C;
  --desk:#9CDCEF;
  --dot:#7CCDE4;
  --scrim:rgba(30,50,64,.5);
  --lift:0 5px 0 rgba(53,69,83,.10), 0 16px 28px -16px rgba(53,69,83,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E2A35; --card:#27333F; --grid:#2B3A48; --ink:#F1F7FB; --ink2:#A9BFD1;
    --line:#3C4C5A; --red:#FF8073; --red-soft:#4C2521; --ai:#4FDCEC; --ai-soft:#123B43;
    --me:#7CB7F7; --me-soft:#1B2C40; --sensei:#FF9EC3; --sensei-soft:#3D2130;
    --ok:#4FD897; --ok-soft:#163C2A; --sun:#FFD469; --desk:#0F1E2B; --dot:#1A2E3F;
    --scrim:rgba(0,0,0,.7);
    --lift:0 5px 0 rgba(0,0,0,.3), 0 18px 32px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#1E2A35; --card:#27333F; --grid:#2B3A48; --ink:#F1F7FB; --ink2:#A9BFD1;
  --line:#3C4C5A; --red:#FF8073; --red-soft:#4C2521; --ai:#4FDCEC; --ai-soft:#123B43;
  --me:#7CB7F7; --me-soft:#1B2C40; --sensei:#FF9EC3; --sensei-soft:#3D2130;
  --ok:#4FD897; --ok-soft:#163C2A; --sun:#FFD469; --desk:#0F1E2B; --dot:#1A2E3F;
  --scrim:rgba(0,0,0,.7);
  --lift:0 5px 0 rgba(0,0,0,.3), 0 18px 32px -18px rgba(0,0,0,.9);
}
:root{
  --f-text:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","Yu Gothic Medium","游ゴシック Medium","Noto Sans JP",sans-serif;
  --f-head:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","UD デジタル 教科書体 NK-B","UD Digi Kyokasho NK-B","Yu Gothic","游ゴシック","Noto Sans JP",sans-serif;
  --f-ui:-apple-system,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0;
  background-color:var(--desk);
  background-image:radial-gradient(var(--dot) 2px, transparent 2.2px);
  background-size:20px 20px;
  color:var(--ink);
  font-family:var(--f-text);
  font-size:17.5px;
  line-height:1.95;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:8px}

/* ============ notebook ============ */
.book{
  max-width:780px;margin:0 auto;min-height:100vh;
  background:
    repeating-linear-gradient(to bottom, transparent 0 37px, var(--grid) 37px 38px),
    var(--paper);
  border-left:3px solid var(--line);border-right:3px solid var(--line);
  position:relative;display:flex;flex-direction:column;
}
.book::before{content:"";position:absolute;top:0;bottom:0;left:48px;width:2px;background:var(--red);opacity:.3}
.inner{padding:0 26px 0 70px;flex:1;display:flex;flex-direction:column;gap:24px}
@media (max-width:600px){
  .book::before{left:24px}
  .inner{padding:0 15px 0 38px}
  body{font-size:16.5px;background-size:16px 16px}
}

/* ============ header ============ */
header{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 0 12px;position:sticky;top:0;z-index:30;
  background:linear-gradient(var(--paper) 78%, transparent);
}
.brand{font-family:var(--f-head);font-size:16px;margin-right:auto;letter-spacing:.02em}
.brand b{color:var(--ai)}
.stampcard{display:flex;gap:5px;align-items:center}
.stampcard i{
  width:19px;height:19px;border-radius:50%;border:2px dashed var(--line);
  display:block;transition:.3s;
}
.stampcard i.on{
  border:2px solid var(--sun);background:var(--sun);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--sun) 28%, transparent);
  animation:pop .4s cubic-bezier(.2,1.7,.4,1) both;
}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* ============ chunky buttons ============ */
.btn{
  font-family:var(--f-head);font-size:16px;cursor:pointer;border:none;
  border-radius:999px;padding:11px 24px;color:#fff;background:var(--ink);
  box-shadow:0 5px 0 color-mix(in srgb, var(--ink) 55%, #000);
  transition:transform .1s, box-shadow .1s, filter .15s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 color-mix(in srgb, var(--ink) 55%, #000)}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn.red{background:var(--red);box-shadow:0 5px 0 color-mix(in srgb, var(--red) 55%, #000)}
.btn.red:active{box-shadow:0 0 0 var(--red)}
.btn.go{background:var(--ai);box-shadow:0 5px 0 color-mix(in srgb, var(--ai) 55%, #000)}
.btn.go:active{box-shadow:0 0 0 var(--ai)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 0 0 2.5px var(--line) inset}
.btn.ghost:active{transform:translateY(2px)}
.btn.big{font-size:19px;padding:14px 34px}

/* ============ avatars ============ */
.ava{width:44px;height:44px;flex:none;display:block}
.ava.sm{width:34px;height:34px}

/* ============ log ============ */
#log{display:flex;flex-direction:column;gap:22px}
.turn{animation:bounceIn .42s cubic-bezier(.2,1.35,.4,1) both}
@keyframes bounceIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

.narr{display:flex;gap:12px;align-items:flex-start}
.narr .bub{
  background:var(--sensei-soft);border-radius:6px 18px 18px 18px;
  padding:12px 17px;font-size:16.5px;position:relative;flex:1;
  box-shadow:0 3px 0 color-mix(in srgb, var(--sensei) 22%, transparent);
}
.narr .who{font-family:var(--f-head);color:var(--sensei);display:block;font-size:14.5px}

.me{
  align-self:flex-end;max-width:88%;background:var(--me-soft);color:var(--me);
  border-radius:18px 18px 6px 18px;padding:12px 18px;font-size:16.5px;
  box-shadow:0 3px 0 color-mix(in srgb, var(--me) 22%, transparent);
}
.me .lbl{font-family:var(--f-head);font-size:13px;opacity:.8;display:block}

.sheet{
  background:var(--card);border-radius:6px 20px 20px 20px;
  box-shadow:var(--lift);padding:16px 20px 16px;position:relative;
  margin-left:52px;
}
.sheet .avawrap{position:absolute;left:-52px;top:0}
.sheet .head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sheet .name{font-family:var(--f-head);font-size:15px;color:var(--ai)}
.tally{
  margin-left:auto;font-family:var(--f-head);font-size:13.5px;color:var(--red);
  background:var(--red-soft);border-radius:999px;padding:3px 13px;white-space:nowrap;
}
.tally.done{color:var(--ok);background:var(--ok-soft)}
.tally.bump{animation:pop .38s cubic-bezier(.2,1.7,.4,1)}
.body{font-size:17px}
@media (max-width:600px){
  .sheet{margin-left:0}
  .sheet .avawrap{position:static;margin-bottom:2px}
}

/* clickable text */
.seg{cursor:pointer;border-radius:6px;padding:2px 1px;transition:background .15s, box-shadow .15s}
.sheet.live .seg:hover{background:var(--sun);box-shadow:0 0 0 4px var(--sun);color:#354553}
.seg.marked{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2.5px;cursor:default}
.seg.checked{color:var(--ink2);opacity:.55;cursor:default}
.fix{color:var(--ok);font-family:var(--f-head)}
.fix::before{content:"→ ";color:var(--red)}
.tagmark{
  font-family:var(--f-head);font-size:12px;color:#fff;background:var(--red);
  border-radius:999px;padding:1px 10px;margin:0 4px;white-space:nowrap;
  display:inline-block;transform:rotate(-2deg);
}

/* ============ choices ============ */
.prompt-q{font-family:var(--f-head);font-size:16px;color:var(--ink2);margin:0}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{
  text-align:left;font-family:var(--f-text);font-size:16.5px;line-height:1.85;
  background:var(--paper);border:none;border-radius:18px;
  box-shadow:0 0 0 2.5px var(--line) inset, 0 4px 0 var(--line);
  padding:14px 18px 14px 54px;cursor:pointer;position:relative;color:var(--ink);
  transition:transform .12s, box-shadow .12s;
}
.choice::before{
  content:attr(data-n);position:absolute;left:14px;top:13px;
  width:28px;height:28px;border-radius:50%;background:var(--line);color:var(--paper);
  display:grid;place-items:center;font-family:var(--f-head);font-size:15px;
  transition:background .15s;
}
.choice:hover{transform:translateY(-3px);box-shadow:0 0 0 2.5px var(--me) inset, 0 7px 0 var(--me)}
.choice:hover::before{background:var(--me)}
.choice:active{transform:translateY(1px);box-shadow:0 0 0 2.5px var(--me) inset, 0 2px 0 var(--me)}

.verdict{display:flex;gap:12px;align-items:center;border-radius:18px;padding:13px 18px;font-size:16px;line-height:1.8}
.verdict .mark{font-family:var(--f-head);font-size:30px;line-height:1;flex:none}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.mid{background:var(--me-soft);color:var(--me)}
.verdict.bad{background:var(--red-soft);color:var(--red)}
.verdict b{font-family:var(--f-head);display:block}

.footbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:2px 0 34px}
.hint{font-family:var(--f-head);font-size:14.5px;color:var(--red);background:var(--red-soft);
  border-radius:999px;padding:6px 14px;margin-left:auto}

/* ============ title ============ */
.title{padding:26px 0 30px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.title h1{font-family:var(--f-head);font-size:clamp(32px,8vw,50px);line-height:1.3;margin:0;text-wrap:balance}
.eyebrow{
  font-family:var(--f-head);font-size:14px;color:#fff;background:var(--red);
  border-radius:999px;padding:5px 16px;display:inline-block;transform:rotate(-2deg);
}
.title p{margin:0;max-width:33em}
.heroline{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.heroline .ava{width:64px;height:64px}
.rules{
  border-radius:20px;padding:16px 22px;background:var(--ai-soft);width:100%;
  box-shadow:0 5px 0 color-mix(in srgb, var(--ai) 22%, transparent);
}
.rules h2{font-family:var(--f-head);font-size:16px;margin:0 0 8px;color:var(--ai)}
.rules ol{margin:0;padding-left:1.3em;font-size:16px}
.rules li{margin:5px 0}

/* ============ result ============ */
.result{display:flex;flex-direction:column;gap:22px;padding-bottom:44px}
.card-g{
  background:var(--card);border-radius:24px;padding:22px;text-align:center;
  box-shadow:var(--lift);display:flex;flex-direction:column;align-items:center;gap:4px;
}
.card-g .rank{font-family:var(--f-head);font-size:24px;color:var(--red)}
.card-g .pts{font-family:var(--f-head);font-size:52px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.card-g .pts small{font-size:17px;color:var(--ink2)}
.bestcombo{font-family:var(--f-head);font-size:15px;color:#fff;background:var(--sun);
  border-radius:999px;padding:3px 16px;margin-top:6px;
  box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 50%,#000)}
.markwrap{position:relative;width:130px;height:130px}
.markwrap svg{width:100%;height:100%;overflow:visible}
.spark{position:absolute;inset:0;pointer-events:none}
.spark i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--sun);
  left:50%;top:50%;opacity:0;animation:sparkle .9s ease-out forwards}
@keyframes sparkle{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1)}}

table.score{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:16px}
table.score th,table.score td{padding:9px 14px;text-align:left;background:var(--paper);
  box-shadow:0 0 0 2px var(--line) inset}
table.score th{font-family:var(--f-head);font-weight:400;color:var(--ink2);font-size:15px;
  border-radius:14px 0 0 14px}
table.score td{text-align:right;font-family:var(--f-head);white-space:nowrap;border-radius:0 14px 14px 0}
.sec-h{
  font-family:var(--f-head);font-size:17px;color:#fff;background:var(--red);
  border-radius:999px;padding:6px 20px;margin:0;align-self:flex-start;transform:rotate(-1deg);
}
.sec-h.blue{background:var(--ai)}
.miss{background:var(--red-soft);border-radius:16px;padding:11px 17px;font-size:16px}
.miss .q{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--red);display:block}
.miss .w{display:block;color:var(--red)}
.promise{counter-reset:p;display:flex;flex-direction:column;gap:9px;padding:0;margin:0;list-style:none}
.promise li{position:relative;padding-left:40px;font-family:var(--f-head);font-size:16.5px}
.promise li::before{
  counter-increment:p;content:counter(p);position:absolute;left:0;top:3px;
  width:28px;height:28px;border-radius:50%;background:var(--ai);color:#fff;
  display:grid;place-items:center;font-size:14px;
}
details.adults{background:var(--paper);box-shadow:0 0 0 2.5px var(--line) inset;border-radius:18px;padding:13px 19px;font-size:15.5px}
details.adults summary{cursor:pointer;font-family:var(--f-head);font-size:15px;color:var(--ink2)}
details.adults ul{padding-left:1.2em;margin:10px 0 0}

/* ============ modal ============ */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:var(--scrim)}
.modal[hidden]{display:none}
.msheet{
  background:var(--paper);border-radius:26px;max-width:500px;width:100%;padding:24px;
  box-shadow:0 10px 0 rgba(0,0,0,.14), 0 30px 50px -20px rgba(0,0,0,.5);
  animation:bounceIn .3s cubic-bezier(.2,1.5,.4,1) both;max-height:88vh;overflow-y:auto;
}
.mlabel{font-family:var(--f-head);font-size:14px;color:var(--ink2);margin:0 0 8px}
.mquote{margin:0 0 18px;padding:12px 16px;background:var(--card);border-radius:16px;font-size:16px}
.mq{font-family:var(--f-head);font-size:19px;margin:0 0 16px;text-align:center}
.mbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mres .why{font-size:16px;margin:14px 0 16px}
.mres .fixline{background:var(--ok-soft);color:var(--ok);padding:11px 15px;border-radius:16px;font-size:16px;margin:0 0 18px}
.mres .hana{display:flex;justify-content:center;margin:-4px 0 2px}
.mres .hana .markwrap{width:104px;height:104px}

.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .85s cubic-bezier(.4,.1,.3,1) forwards}
.draw.d2{animation-delay:.5s}
@keyframes draw{to{stroke-dashoffset:0}}

/* ============ kid UX ============ */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.step{background:var(--paper);border-radius:18px;box-shadow:0 0 0 2.5px var(--line) inset,0 4px 0 var(--line);
  padding:14px 10px 12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.step .sn{width:28px;height:28px;border-radius:50%;background:var(--ai);color:var(--paper);
  font-family:var(--f-head);display:grid;place-items:center;font-size:15px;flex:none}
.step .si{font-size:34px;line-height:1.2}
.step .st{font-family:var(--f-head);font-size:15.5px;line-height:1.5}
.step .sd{font-size:12.5px;color:var(--ink2);line-height:1.5}
.title .memo{font-size:14px;color:var(--ink2);margin:0}
@media (max-width:600px){
  .steps{grid-template-columns:1fr}
  .step{flex-direction:row;text-align:left;padding:10px 14px;gap:12px}
  .step .si{font-size:26px}
}

/* タッチできる文の常時アフォーダンス（正解も不正解も同じ見た目） */
.sheet.live .seg:not(.marked):not(.checked){
  text-decoration:underline dotted color-mix(in srgb, var(--ai) 60%, transparent);
  text-decoration-thickness:2px;text-underline-offset:5px;
}
.skipchip{position:absolute;right:12px;bottom:8px;font-family:var(--f-head);font-size:13px;
  color:var(--ai);background:var(--ai-soft);border:none;border-radius:999px;padding:6px 14px;cursor:pointer}

/* 初回チュートリアル */
.coach{display:flex;gap:12px;align-items:center;align-self:center;
  background:var(--sun);color:#354553;border-radius:999px;padding:10px 22px;
  font-family:var(--f-head);font-size:16.5px;
  box-shadow:0 4px 0 color-mix(in srgb, var(--sun) 55%, #000)}
.coach .hand{font-size:26px;animation:handtap 1s ease-in-out infinite}
@keyframes handtap{0%,100%{transform:translateY(-2px)}50%{transform:translateY(6px)}}
.sheet.live.coachlight{animation:coachpulse 1.7s ease-out infinite}
@keyframes coachpulse{
  0%{box-shadow:var(--lift), 0 0 0 0 color-mix(in srgb, var(--sun) 75%, transparent)}
  70%{box-shadow:var(--lift), 0 0 0 13px transparent}
  100%{box-shadow:var(--lift), 0 0 0 0 transparent}}

.cnote{font-size:15.5px;color:var(--ink2);text-align:center;margin:-6px 0 18px}

/* ============ FX layers ============ */
#fxCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
#flash{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:0;background:#fff}
#flash.on{animation:flash .5s ease-out}
#flash.bad{background:var(--red)}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}

#wipe{position:fixed;inset:0;pointer-events:none;z-index:78;transform:translateX(-110%);
  background:linear-gradient(100deg,var(--ai) 0 62%,var(--sun) 62% 100%)}
#wipe.on{animation:wipe .72s cubic-bezier(.7,0,.3,1)}
@keyframes wipe{0%{transform:translateX(-110%) skewX(-8deg)}45%{transform:translateX(0) skewX(-8deg)}100%{transform:translateX(115%) skewX(-8deg)}}

#banner{position:fixed;left:0;right:0;top:30%;z-index:82;pointer-events:none;text-align:center;
  font-family:var(--f-head);font-size:clamp(38px,10vw,76px);color:#fff;opacity:0;
  text-shadow:0 0 0 #fff, 4px 4px 0 var(--ink), -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink), 0 12px 24px rgba(0,0,0,.35)}
#banner.on{animation:bannerIn 1.25s cubic-bezier(.2,1.6,.35,1) forwards}
@keyframes bannerIn{
  0%{opacity:0;transform:scale(2.6) rotate(-9deg)}
  16%{opacity:1;transform:scale(1) rotate(-4deg)}
  26%{transform:scale(1.1) rotate(-4deg)}
  36%{transform:scale(1) rotate(-4deg)}
  80%{opacity:1;transform:scale(1) rotate(-4deg)}
  100%{opacity:0;transform:scale(1.25) translateY(-26px) rotate(-4deg)}}

#combo{position:fixed;right:16px;top:96px;z-index:82;pointer-events:none;opacity:0;
  font-family:var(--f-head);font-size:26px;color:#fff;background:var(--sun);
  border-radius:999px;padding:5px 20px;box-shadow:0 5px 0 color-mix(in srgb,var(--sun) 50%,#000)}
#combo.on{animation:comboIn 1.1s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes comboIn{0%{opacity:0;transform:scale(0) rotate(12deg)}18%{opacity:1;transform:scale(1.15) rotate(-6deg)}
  30%{transform:scale(1) rotate(-6deg)}75%{opacity:1}100%{opacity:0;transform:scale(.9) translateY(-14px) rotate(-6deg)}}

.sfxbtn{
  border:none;background:var(--ai-soft);color:var(--ai);border-radius:50%;
  width:38px;height:38px;font-size:17px;cursor:pointer;line-height:1;
  box-shadow:0 3px 0 color-mix(in srgb,var(--ai) 35%, transparent);transition:transform .1s}
.sfxbtn:active{transform:translateY(3px);box-shadow:none}
.sfxbtn.off{background:var(--line);color:var(--ink2);box-shadow:none;opacity:.75}

/* ============ motion ============ */
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}

.choice{animation:slideIn .36s cubic-bezier(.2,1.35,.4,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(-26px) rotate(-1.5deg)}to{opacity:1;transform:none}}

.float{animation:floaty 3.4s ease-in-out infinite}
.float:nth-child(2){animation-delay:-1.4s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(2deg)}}

.talking{animation:bob .46s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}

.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%,97.5%{transform:scaleY(.1)}}

.seg.typing::after{content:"▍";color:var(--ai);animation:caret .55s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

.hit{animation:hit .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes hit{0%{transform:scale(1)}30%{transform:scale(1.14) rotate(-3deg)}100%{transform:scale(1)}}

@media (max-width:600px){#combo{top:auto;bottom:22px;right:12px;font-size:21px}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;
    animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .draw{stroke-dashoffset:0}
  #wipe,#banner,#combo,#flash{display:none}
}

"use strict";
const $ = (s, r = document) => r.querySelector(s);
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= sound (Web Audio 合成・外部ファイルなし) ================= */
const SFX = (() => {
  let ctx = null, master = null, noiseBuf = null, on = true;
  try { on = localStorage.getItem("mirai-sfx") !== "0"; } catch (e) {}
  function ready() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.34; master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume();
    return on ? ctx : null;
  }
  function tone(o) {
    if (!ready()) return;
    const dur = o.dur || 0.2, t0 = ctx.currentTime + (o.at || 0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.vol == null ? 0.3 : o.vol, t0 + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function noise(o) {
    if (!ready()) return;
    const dur = o.dur || 0.2, t0 = ctx.currentTime + (o.at || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = "bandpass";
    f.frequency.setValueAtTime(o.f || 1200, t0);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
    f.Q.value = o.q || 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(o.vol || 0.18, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }
  const api = {
    isOn: () => on,
    unlock() { ready(); },
    toggle() { on = !on; try { localStorage.setItem("mirai-sfx", on ? "1" : "0"); } catch (e) {} if (on) { ready(); api.tap(); } return on; },
    tap()   { tone({ f: 660, f2: 900, type: "square", dur: 0.07, vol: 0.16 }); },
    hover() { tone({ f: 1180, dur: 0.04, vol: 0.05 }); },
    type()  { tone({ f: 720 + Math.random() * 240, type: "square", dur: 0.022, vol: 0.035 }); },
    pick()  { tone({ f: 523, type: "triangle", dur: 0.09, vol: 0.22 }); tone({ f: 784, type: "triangle", dur: 0.15, vol: 0.22, at: 0.07 }); },
    correct(){ tone({ f: 1046.5, dur: 0.17, vol: 0.32 }); tone({ f: 1568, dur: 0.52, vol: 0.3, at: 0.15 }); tone({ f: 2093, dur: 0.4, vol: 0.09, at: 0.15 }); },
    wrong() { tone({ f: 172, f2: 122, type: "sawtooth", dur: 0.16, vol: 0.2 }); tone({ f: 152, f2: 104, type: "sawtooth", dur: 0.32, vol: 0.2, at: 0.18 }); },
    stamp() { tone({ f: 280, f2: 1050, type: "square", dur: 0.11, vol: 0.2 }); noise({ f: 2600, dur: 0.06, vol: 0.12 }); },
    swish() { noise({ f: 380, f2: 4400, dur: 0.32, vol: 0.16, q: 0.7 }); },
    combo(n){ const b = 784 * Math.pow(1.122, Math.min(n, 7)); tone({ f: b, type: "triangle", dur: 0.1, vol: 0.26 }); tone({ f: b * 1.5, type: "triangle", dur: 0.17, vol: 0.2, at: 0.08 }); },
    tick()  { tone({ f: 1500, type: "square", dur: 0.018, vol: 0.055 }); },
    roll()  { for (let i = 0; i < 18; i++) noise({ f: 1900, dur: 0.05, vol: 0.09, at: i * 0.05, q: 2.2 }); },
    fanfare(){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone({ f, type: "triangle", dur: 0.22, vol: 0.26, at: i * 0.11 }));
               [523.25, 659.25, 783.99, 1046.5].forEach(f => tone({ f, type: "triangle", dur: 0.95, vol: 0.15, at: 0.47 })); },
    sad()   { [523.25, 466.16, 392].forEach((f, i) => tone({ f, type: "triangle", dur: 0.3, vol: 0.22, at: i * 0.17 })); }
  };
  return api;
})();

/* ================= visual FX ================= */
const FX = (() => {
  const cv = $("#fxCanvas"), cx = cv.getContext("2d");
  const COLORS = ["#FF4B3E", "#FFC63C", "#00A3B8", "#2FB673", "#FF6FA5", "#3E8CE0"];
  let parts = [], raf = null;
  function size() {
    const r = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * r; cv.height = innerHeight * r;
    cx.setTransform(r, 0, 0, r, 0, 0);
  }
  addEventListener("resize", size); size();
  function loop() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 60);
    for (const p of parts) {
      p.vy += 0.33; p.vx *= 0.995; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.globalAlpha = Math.min(1, p.life / 24); cx.fillStyle = p.c;
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 7); cx.fill(); }
      else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(loop);
    else { raf = null; cx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function spawn(n, ox, oy, power, up) {
    if (REDUCE) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * power + power * 0.35;
      parts.push({
        x: ox, y: oy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (up || 4),
        w: 6 + Math.random() * 7, h: 8 + Math.random() * 10,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.34,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        life: 80 + Math.random() * 50, round: Math.random() < 0.3
      });
    }
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function cls(id, name, ms) {
    const n = $(id); if (!n) return;
    n.classList.remove(name); void n.offsetWidth; n.classList.add(name);
    setTimeout(() => n.classList.remove(name), ms);
  }
  return {
    burstAt(node, n) {
      if (!node) return;
      const r = node.getBoundingClientRect();
      spawn(n || 36, r.left + r.width / 2, r.top + r.height / 2, 9);
    },
    rain(n) {
      if (REDUCE) return;
      for (let i = 0; i < (n || 70); i++) {
        parts.push({
          x: Math.random() * innerWidth, y: -20 - Math.random() * 220,
          vx: (Math.random() - 0.5) * 3, vy: Math.random() * 2,
          w: 7 + Math.random() * 7, h: 9 + Math.random() * 11,
          rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
          c: COLORS[(Math.random() * COLORS.length) | 0],
          life: 200 + Math.random() * 90, round: Math.random() < 0.28
        });
      }
      if (!raf) raf = requestAnimationFrame(loop);
    },
    flash(bad) { const f = $("#flash"); f.classList.toggle("bad", !!bad); cls("#flash", "on", 520); },
    wipe() { cls("#wipe", "on", 760); },
    banner(text, color) {
      const b = $("#banner"); b.textContent = text;
      b.style.color = color || "#fff";
      cls("#banner", "on", 1300);
    },
    combo(n) { const c = $("#combo"); c.textContent = n + " れんぞく!"; cls("#combo", "on", 1150); },
    shake() { cls(".book", "shake", 480); }
  };
})();

/* first gesture unlocks audio */
["pointerdown", "keydown"].forEach(ev =>
  document.addEventListener(ev, () => SFX.unlock(), { once: true }));

$("#btnSfx").addEventListener("click", () => {
  const on = SFX.toggle();
  $("#btnSfx").textContent = on ? "🔊" : "🔇";
  $("#btnSfx").classList.toggle("off", !on);
});
if (!SFX.isOn()) { $("#btnSfx").textContent = "🔇"; $("#btnSfx").classList.add("off"); }

/* generic hover/click sound */
document.addEventListener("pointerover", e => {
  if (e.target.closest(".btn,.choice,.seg,.sfxbtn")) SFX.hover();
});
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".btn");
  if (b && b.id !== "myes" && b.id !== "btnSfx") SFX.tap();
});

/* kind: "hana" | "maru" | "sankaku" */
function markSVG(kind, animate) {
  const cls = animate ? "draw" : "";
  const cls2 = animate ? "draw d2" : "";
  let inner;
  if (kind === "hana") {
    inner = '<path d="' + HANA_PATH + '" class="' + cls + '" style="--len:250"/>' +

  }
  return '<svg viewBox="0 0 100 100" fill="none" stroke="var(--red)" stroke-width="6.5" stroke-linecap="round" aria-hidden="true">' + inner + "</svg>";
}
function sparks(host) {
  if (REDUCE) return;
  const s = document.createElement("span");
  s.className = "spark";
  for (let i = 0; i < 10; i++) {
    const d = document.createElement("i");
    const a = (i / 10) * Math.PI * 2, r = 62 + Math.random() * 20;
    d.style.setProperty("--tx", (Math.cos(a) * r - 4).toFixed(1) + "px");
    d.style.setProperty("--ty", (Math.sin(a) * r - 4).toFixed(1) + "px");
    d.style.animationDelay = (0.55 + i * 0.015).toFixed(2) + "s";
    s.appendChild(d);
  }
  host.appendChild(s);
}

/* ================= state ================= */
let S;
function reset() {
  S = { i: 0, picks: [], found: 0, total: 0, wrong: 0, combo: 0, best: 0, missed: [], cur: null, typing: false, finished: false, coached: false };
}
function el(tag, cls, txt) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= game ================= */
function startGame() {
  reset();
  SFX.unlock(); SFX.swish(); FX.wipe();
  $("#screen").innerHTML = '<div id="log"></div><div id="stage"></div>';
  const sc = $("#stampcard");
  sc.hidden = false;
  sc.innerHTML = STEPS.map(() => "<i></i>").join("");
  $("#btnSubmit").hidden = false;
  $("#btnSubmit").disabled = true;
  showStep();
}
function updStamps() {
  const dots = $("#stampcard").children;
  let added = false;
  for (let k = 0; k < dots.length; k++) {
    const want = k < S.picks.length;
    if (want && !dots[k].classList.contains("on")) added = true;
    dots[k].classList.toggle("on", want);
  }
  if (added) SFX.stamp();
}

function showStep() {
  const step = STEPS[S.i];
  const log = $("#log");

  const n = el("div", "turn narr");
  const av = el("span");
  av.style.color = step.face === "ai" ? "var(--ai)" : "var(--sensei)";
  av.innerHTML = step.face === "ai" ? AVA_AI : AVA_SENSEI;
  const bub = el("div", "bub");
  bub.appendChild(el("span", "who", step.who));
  bub.appendChild(document.createTextNode(step.narr));
  if (step.face === "ai") {
    bub.style.background = "var(--ai-soft)";
    bub.style.boxShadow = "0 3px 0 color-mix(in srgb, var(--ai) 22%, transparent)";
    bub.querySelector(".who").style.color = "var(--ai)";
  }
  n.appendChild(av); n.appendChild(bub);
  log.appendChild(n);

  const stage = $("#stage");
  stage.innerHTML = "";
  const wrap = el("div", "turn");
  wrap.style.cssText = "display:flex;flex-direction:column;gap:13px";
  wrap.appendChild(el("p", "prompt-q", "▼ " + step.ask));

  const ch = el("div", "choices");
  shuffle(["bad", "mid", "good"]).forEach((q, idx) => {
    const b = el("button", "choice", step.choices[q].text);
    b.type = "button";
    b.dataset.n = idx + 1;
    b.style.animationDelay = (0.09 + idx * 0.09) + "s";
    b.addEventListener("click", () => choose(q));
    ch.appendChild(b);
  });
  wrap.appendChild(ch);
  stage.appendChild(wrap);
  wrap.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "center" });
}

async function choose(q) {
  const step = STEPS[S.i];
  SFX.pick();
  S.picks.push(q);
  updStamps();
  const log = $("#log");
  $("#stage").innerHTML = "";

  const me = el("div", "turn me");
  me.appendChild(el("span", "lbl", "きみ"));
  me.appendChild(document.createTextNode(step.choices[q].text));
  log.appendChild(me);

  const meta = QMETA[q];
  const v = el("div", "turn verdict " + q);
  v.appendChild(el("span", "mark", meta.mark));
  const tx = el("div");
  tx.appendChild(el("b", null, "この 聞き方は「" + meta.label + "」"));
  tx.appendChild(document.createTextNode(step.choices[q].fb));
  v.appendChild(tx);
  log.appendChild(v);
  v.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "end" });

  await sleep(REDUCE ? 60 : 640);
  await renderReply(step.reply[q]);
}

  const log = $("#log");
  const sheet = el("div", "turn sheet");
  const aw = el("div", "avawrap");
  aw.style.color = "var(--ai)";
  aw.innerHTML = AVA_AI;
  sheet.appendChild(aw);

  const head = el("div", "head");
  head.appendChild(el("span", "name", "ミライ"));
  const tally = el("span", "tally");
  head.appendChild(tally);
  sheet.appendChild(head);
  const body = el("div", "body");
  sheet.appendChild(body);
  log.appendChild(sheet);

  const errs = segs.filter(s => s.e).length;
  S.total += errs;
  S.cur = { sheet, tally, errs, found: 0, segs, nodes: [] };

  S.typing = true;
  aw.firstChild.classList.add("talking");
  let skip = REDUCE;
  const skipper = () => { skip = true; };
  sheet.addEventListener("click", skipper);
  let chip = null;
  if (!REDUCE) {
    chip = el("button", "skipchip", "▶▶ ぜんぶ 見る");
    chip.type = "button";
    chip.addEventListener("click", () => { skip = true; });
    sheet.appendChild(chip);
  }

  for (let i = 0; i < segs.length; i++) {
    const sp = el("span", "seg typing");
    sp.setAttribute("role", "button");
    sp.setAttribute("tabindex", "-1");
    sp.dataset.i = i;
    body.appendChild(sp);
    S.cur.nodes.push(sp);
    const text = segs[i].t;
    if (skip) sp.textContent = text;
    else {
      for (let c = 0; c < text.length; c++) {
        sp.textContent += text[c];
        if (skip) { sp.textContent = text; break; }
        if (c % 3 === 0) SFX.type();
        if (c % 2 === 0) await sleep(15);
      }
      sheet.scrollIntoView({ behavior: "smooth", block: "end" });
    }
    sp.classList.remove("typing");
    body.appendChild(document.createTextNode(" "));
  }
  if (chip) chip.remove();
  sheet.removeEventListener("click", skipper);
  aw.firstChild.classList.remove("talking");
  S.typing = false;

  sheet.classList.add("live");
  S.cur.nodes.forEach(sp => {
    sp.setAttribute("tabindex", "0");
    sp.addEventListener("click", () => openModal(+sp.dataset.i));
    sp.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openModal(+sp.dataset.i); }
    });
  });
  if (!S.coached) {
    S.coached = true;
    sheet.classList.add("coachlight");
    const c = el("div", "turn coach");
    c.id = "coach";
    c.innerHTML = '<span class="hand">👆</span><span>おかしいなと 思う文を タッチしてみよう!</span>';
    log.appendChild(c);
  }
  updTally(false);
  showFoot();
}

function updTally(bump) {
  const c = S.cur;
  if (c.errs === 0) { c.tally.textContent = "この答えは きれい!"; c.tally.classList.add("done"); return; }
  const done = c.found === c.errs;
  c.tally.textContent = done ? "ぜんぶ 見つけた! " + c.errs + "/" + c.errs
                             : "おかしいところ " + c.found + "/" + c.errs;
  c.tally.classList.toggle("done", done);
  if (bump) { c.tally.classList.remove("bump"); void c.tally.offsetWidth; c.tally.classList.add("bump"); }
}

function showFoot() {
  const stage = $("#stage");
  stage.innerHTML = "";
  const f = el("div", "footbar turn");
  const last = S.i >= STEPS.length - 1;
  if (!last) {
    const b = el("button", "btn go", "つぎの しつもんへ →");
    b.addEventListener("click", () => {
      SFX.swish(); FX.wipe();
      collectMissed(); S.i++; $("#stage").innerHTML = ""; showStep();
    });
    f.appendChild(b);
  }
  const sub = el("button", last ? "btn red big" : "btn red", last ? "先生に出す!" : "ここで 先生に出す");
  sub.addEventListener("click", askSubmit);
  f.appendChild(sub);
  f.appendChild(el("span", "hint", S.cur.errs > 0 ? "🔍 あやしい文を タッチ!" : "つぎへ すすもう"));
  stage.appendChild(f);
  $("#btnSubmit").disabled = false;
}

function collectMissed() {
  if (!S.cur) return;
  S.cur.segs.forEach((s, i) => {
    if (s.e && !S.cur.nodes[i].classList.contains("marked")) S.missed.push({ t: s.t, e: s.e });
  });
  S.cur = null;
}

/* ================= modal ================= */
let modalIdx = null;
function openModal(i) {
  if (S.typing || !S.cur) return;
  const node = S.cur.nodes[i];
  if (node.classList.contains("marked") || node.classList.contains("checked")) return;
  const co = $("#coach"); if (co) co.remove();
  const cl = document.querySelector(".coachlight"); if (cl) cl.classList.remove("coachlight");
  modalIdx = i;
  $("#mquote").textContent = S.cur.segs[i].t;
  $("#mask").hidden = false;
  $("#mres").hidden = true;
  $("#mhana").hidden = true;
  $("#mhana").innerHTML = "";
  $("#modal").hidden = false;
  $("#myes").focus();
}
function closeModal() { $("#modal").hidden = true; modalIdx = null; }
$("#mno").addEventListener("click", closeModal);
$("#mclose").addEventListener("click", closeModal);
$("#modal").addEventListener("click", ev => { if (ev.target === $("#modal")) closeModal(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#modal").hidden) closeModal(); });

$("#myes").addEventListener("click", () => {
  const i = modalIdx, seg = S.cur.segs[i], node = S.cur.nodes[i];
  const vd = $("#mverdict"), fixEl = $("#mfix"), hana = $("#mhana");
  vd.className = "verdict";

  if (seg.e) {
    S.found++; S.cur.found++;
    node.classList.add("marked");
    const tag = el("span", "tagmark", seg.e.tag);
    node.after(tag);
    const fx = el("span", "fix", seg.e.fix);
    tag.after(document.createTextNode(" "));
    tag.after(fx);

    const mw = el("div", "markwrap");
    mw.innerHTML = markSVG("hana", true);
    sparks(mw);
    hana.appendChild(mw);
    hana.hidden = false;

    vd.classList.add("good");
    vd.innerHTML = '<span class="mark">◎</span><div><b>ピンポーン! 見つけた!</b>' + seg.e.tag + " の まちがい</div>";
    $("#mwhy").textContent = seg.e.why;
    fixEl.hidden = false;
    fixEl.textContent = "ミライ:「" + seg.e.fix + "」";
    updTally(true);

    S.combo++; if (S.combo > S.best) S.best = S.combo;
    SFX.correct();
    FX.flash(false);
    FX.banner("ピンポーン!", "#FFC63C");
    setTimeout(() => { FX.burstAt(mw, 40); }, REDUCE ? 0 : 420);
    if (S.combo >= 2) setTimeout(() => { FX.combo(S.combo); SFX.combo(S.combo); }, REDUCE ? 0 : 700);
    if (S.cur.found === S.cur.errs) {
      setTimeout(() => { FX.banner("パーフェクト!", "#2FB673"); SFX.fanfare(); FX.rain(40); }, REDUCE ? 0 : 1150);
    }
  } else {
    S.wrong++; S.combo = 0;
    node.classList.add("checked");
    vd.classList.add("mid");
    vd.innerHTML = '<span class="mark">〜</span><div><b>ここは 大じょうぶ そうだよ</b>たしかめたのは えらい!</div>';
    $("#mwhy").textContent = "手あたりしだいに 指てきしても、まちがいは 見つからない。数字・言いきり・本の名前・人の情報 ——ここが あやしい ポイントだよ。";
    fixEl.hidden = true;
    SFX.wrong(); FX.flash(true); FX.shake();
  }
  $("#mask").hidden = true;
  $("#mres").hidden = false;
  $("#mclose").focus();
});

/* ================= submit confirm ================= */
function askSubmit() {
  if (S.finished) return;
  const qLeft = STEPS.length - S.picks.length;
  const unfound = S.cur ? S.cur.errs - S.cur.found : 0;
  let msg, note, warn = true;
  if (qLeft > 0) {
    msg = "ほんとうに もう 出す?";
    note = "しつもんは あと " + qLeft + "こ のこっているよ。とちゅうで 出すと、そのぶん てん数は 下がるよ。";
  } else if (unfound > 0) {
    msg = "先生に 出す?";
    note = "この答えには、まだ 見つけていない まちがいが あるかも……。";
  } else {
    msg = "先生に 出そう!";
    note = "おつかれさま! けっかを 見てみよう。";
    warn = false;
  }
  $("#cq").textContent = msg;
  $("#cnote").textContent = note;
  $("#cno").textContent = warn ? "もどって さがす" : "もどる";
  $("#cno").className = warn ? "btn go" : "btn ghost";
  $("#cmodal").hidden = false;
  $("#cno").focus();
}
$("#cno").addEventListener("click", () => { $("#cmodal").hidden = true; });
$("#cyes").addEventListener("click", () => { $("#cmodal").hidden = true; submit(); });
$("#cmodal").addEventListener("click", ev => { if (ev.target === $("#cmodal")) $("#cmodal").hidden = true; });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#cmodal").hidden) $("#cmodal").hidden = true; });

/* ================= result ================= */
$("#btnSubmit").addEventListener("click", () => { if (!$("#btnSubmit").disabled) askSubmit(); });

function countUp(node, target, suffix, done) {
  if (REDUCE || target === 0) { node.innerHTML = target + suffix; if (done) done(); return; }
  const dur = 1100, t0 = performance.now();
  let last = -1;
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur);
    const v = Math.round(target * (1 - Math.pow(1 - k, 3)));
    if (v !== last) { node.innerHTML = v + suffix; last = v; if (v % 2 === 0) SFX.tick(); }
    if (k < 1) requestAnimationFrame(step);
    else { node.classList.add("hit"); if (done) done(); }
  })(t0);
}

function submit() {
  if (S.finished) return;
  collectMissed();
  S.finished = true;
  SFX.swish(); FX.wipe(); SFX.roll();

  const depth = S.picks.reduce((a, q) => a + QMETA[q].pts, 0);
  const rate = S.total === 0 ? 0 : Math.round(S.found / S.total * 100);
  const penalty = Math.min(10, S.wrong * 2);
  const pts = Math.max(0, Math.round(depth * 0.5 + rate * 0.5) - penalty);

  let rank, kind, comment;
  if (pts >= 90) { rank = "たいへん よくできました"; kind = "hana"; comment = "聞き方も たしかめ方も 一流! きみは もう AIに 使われる側では なく、AIを 使う側だよ。"; }
  else if (pts >= 75) { rank = "よくできました"; kind = "hana"; comment = "とても よい。あとは「言いきり」と「数字」を もう一歩 うたがえたら 完ぺきだ。"; }
  else if (pts >= 60) { rank = "もうすこし"; kind = "maru"; comment = "いい線! もう少し 深く 聞いて、答えを ていねいに 読みかえしてみよう。"; }
  else if (pts >= 35) { rank = "がんばりましょう"; kind = "sankaku"; comment = "AIの答えを そのまま 受け取ってしまったところが あったね。まちがいは かならず まざる、を 思い出そう。"; }
  else { rank = "やりなおし"; kind = "sankaku"; comment = "このまま 出すと、まちがいだらけの レポートに なってしまう。もう一度 やってみよう!"; }

  const s = $("#screen");
  s.innerHTML = "";
  $("#btnSubmit").hidden = true;
  $("#stampcard").hidden = true;

  const r = el("div", "result");

  const n = el("div", "narr");
  const av = el("span"); av.style.color = "var(--sensei)"; av.innerHTML = AVA_SENSEI;
  const bub = el("div", "bub");
  bub.appendChild(el("span", "who", "さくら先生"));
  bub.appendChild(document.createTextNode("では、見せてもらいますね……"));
  n.appendChild(av); n.appendChild(bub);
  r.appendChild(n);

  const card = el("div", "card-g");
  const mw = el("div", "markwrap");
  mw.innerHTML = markSVG(kind, true);
  if (kind === "hana") sparks(mw);
  card.appendChild(mw);
  const rankEl = el("div", "rank", rank);
  rankEl.style.opacity = "0";
  card.appendChild(rankEl);
  const p = el("div", "pts");
  p.innerHTML = "0<small> / 100てん</small>";
  card.appendChild(p);
  if (S.best >= 2) card.appendChild(el("div", "bestcombo", "さいこう " + S.best + " れんぞく!"));
  r.appendChild(card);

  setTimeout(() => {
    countUp(p, pts, "<small> / 100てん</small>", () => {
      rankEl.style.opacity = "1";
      rankEl.classList.add("hit");
      if (kind === "hana") { SFX.fanfare(); FX.rain(90); }
      else if (kind === "maru") { SFX.pick(); FX.burstAt(mw, 26); }
      else SFX.sad();
    });
  }, REDUCE ? 0 : 700);

  r.appendChild(el("p", null, comment));

  const tb = el("table", "score");
  tb.innerHTML =
    "<tr><th>調べを 深めた ぐあい</th><td>" + depth + " / 100</td></tr>" +
    "<tr><th>しつもんの 数</th><td>" + S.picks.length + " 回</td></tr>" +
    "<tr><th>おかしいところの 指てき</th><td>" + S.found + " / " + S.total + "(" + rate + "%)</td></tr>" +
    "<tr><th>思いこみで 指てきした 数</th><td>" + S.wrong + " 回(-" + penalty + ")</td></tr>";
  const wrap = el("div"); wrap.style.overflowX = "auto"; wrap.appendChild(tb);
  r.appendChild(wrap);

  r.appendChild(el("h2", "sec-h", S.missed.length
    ? "レポートに のこった まちがい " + S.missed.length + "こ"
    : "レポートに のこった まちがい ゼロ!"));
  if (S.missed.length) {
    S.missed.forEach(m => {
      const d = el("div", "miss");
      d.appendChild(el("span", "q", "「" + m.t + "」"));
      d.appendChild(el("span", "w", "▶ " + m.e.tag + ":" + m.e.why));
      r.appendChild(d);
    });
  } else {
    r.appendChild(el("p", null, "ミライの まちがいを ぜんぶ つかまえた! この見る目が、これから 一番 役に立つよ。"));
  }

  r.appendChild(el("h2", "sec-h blue", "5つの やくそく"));
  const ul = el("ul", "promise");
  ["ひとりで 使わない — おうちの人や 先生が いるところで",
   "ヒミツは 入れない — 名前・住所・学校・顔写真・友だちのこと",
   "かならず たしかめる — 本や 公式の ホームページで 答え合わせ",
   "そのまま 出さない — AIが作ったものは 自分の作品じゃない",
   "こまったら すぐ 言う — こわいもの・へんなものが 出たら 大人に"
  ].forEach(t => ul.appendChild(el("li", null, t)));
  r.appendChild(ul);

  const det = el("details", "adults");
  det.innerHTML = "<summary>先生・おうちの方へ ― このゲームで ねらっている学び</summary><ul>" +
    "<li><b>ハルシネーション</b>:体長・年代など数字の誤り、実在しない書名。仕組み上「正しい時と誤る時をAI自身が区別できない」ことを、良いプロンプトでも誤りが混ざる設計で体感させます。</li>" +
    "<li><b>個人情報・肖像権</b>:氏名／学校／住所、友だちの顔写真、写真の背景から場所が特定される点。</li>" +
    "<li><b>著作権・不正</b>:既存キャラの模倣、AI作品のコンクール応募、丸写し、使用を隠すこと。</li>" +
    "<li><b>安全</b>:川に入る・野生生物を捕る・川の水を飲む等、AIが平然と勧める危険な助言。</li>" +
    "<li><b>検証の作法</b>:「AIに『合ってる?』と聞いても検証にならない」「AIは責任を取れない」「出典を書く」。第3問がこの中心です。</li>" +
    "<li><b>点数の設計</b>:早く出すほど探究点が下がり、見逃した誤りは講評でそのまま返ってきます。「早く終わらせる」が得にならない構造です。</li>" +
    "<li>2〜3回くり返し遊ぶと、選択肢と誤りの組み合わせをすべて体験できます。</li>" +
    "</ul>";
  r.appendChild(det);

  const f = el("div", "footbar");
  const again = el("button", "btn go", "もう一度 やる!");
  again.addEventListener("click", startGame);
  const top = el("button", "btn ghost", "タイトルへ");
  top.addEventListener("click", showTitle);
  f.appendChild(again); f.appendChild(top);
  r.appendChild(f);

  s.appendChild(r);
  window.scrollTo({ top: 0, behavior: REDUCE ? "auto" : "smooth" });
}

showTitle();
</script>

</body>
</html>
